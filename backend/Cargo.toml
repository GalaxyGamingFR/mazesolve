[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
mm-core = { path = "crates/mm-core" }
mm-maze = { path = "crates/mm-maze" }
mm-sim = { path = "crates/mm-sim" }
mm-controller = { path = "crates/mm-controller" }
mm-tuner = { path = "crates/mm-tuner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"
proptest = "1"
rmp-serde = "1"
criterion = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http-body-util = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }

rhai = { version = "~1.27", features = ["sync", "serde", "no_time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
